<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>title</title>
        
    </head>
    <body>
        <form onsubmit="validate()" method="get">
            <label>Name<input type="text" id="name"></label><br>
            <label>age<input type="number" id="age" ></label><br>
            <button type ="submit">Submit</button>
        </form>
        <script>
            function validate(){
                name= document.getElementById("name").value.trim()
                age = document.getElementById("age").value
                if(!name){ alert("Enter valid (name"); return false;}
                if(!(age>0 && age<120)){ alert("Enter age between"); return false;}
                alert("OK" + JSON.stringify({name,age}))
                return false;
            }
        </script>
    </body>
</html>
