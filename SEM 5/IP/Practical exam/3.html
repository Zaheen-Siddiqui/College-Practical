<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Exp3 - CSS3</title>
  <style>
    body { font-family: Arial, sans-serif; background: linear-gradient(#fff,#eef); color:#222; }
    h1 { color: darkblue; }
    table { border-collapse: collapse; width: 50%; }
    table td, table th { border: 1px solid #666; padding: 6px; }
    ul { list-style: square; }
  </style>
</head>
<body>
  <h1>CSS3 Demo</h1>
  <ul><li>Item A</li><li>Item B</li></ul>
  <table><tr><th>Key</th><th>Value</th></tr><tr><td>K</td><td>V</td></tr></table>
</body>
</html>
