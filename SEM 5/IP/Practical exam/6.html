<!doctype html>
<html>
<head><meta charset="utf-8"><title>Exp6 - JS Validation</title></head>
<body>
  <form id="f" onsubmit="return validate()">
    <input id="name" placeholder="Name"><br>
    <input id="age" placeholder="Age" type="number"><br>
    <button>Send</button>
  </form>

  <script>
    function validate(){
      const name = document.getElementById('name').value.trim();
      const age = Number(document.getElementById('age').value);
      if (!name) { alert('Name required'); return false; }
      if (!(age > 0 && age < 120)) { alert('Enter valid age'); return false; }
      // simple loop + object demo
      const out = {name, age};
      for (let k in out) console.log(k, out[k]);
      alert('OK: ' + JSON.stringify(out));
      return false; // prevent actual submit for demo
    }
  </script>
</body>
</html>
